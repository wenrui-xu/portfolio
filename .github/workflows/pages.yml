name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: wenrui-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wenrui-portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build for the Pages URL
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo_name" = "$owner_name.github.io" ]; then
            base_path="/"
          else
            base_path="/$repo_name/"
          fi
          npm run build -- --base="$base_path"
          cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: wenrui-portfolio/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
